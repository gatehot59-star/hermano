[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermano"
version = "0.2.0"
description = "A school-day companion for neurodivergent students, powered by Qloo taste data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jorge Abraham Mendieta"}]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hermano = "hermano.__main__:main"

[tool.setuptools]
packages = ["hermano"]

[tool.setuptools.package-data]
hermano = ["data/*.json"]
