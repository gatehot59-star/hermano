name: secret-scan
on:
  push:
    branches:
      - titan/secret-scan-2026-10-24
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout every branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.18.4
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Controls and history scan
        run: bash .github/secret-scan/run.sh
      - name: Commit the report to this branch
        run: |
          set -euo pipefail
          git config user.name "secret-scan-runner"
          git config user.email "actions@users.noreply.github.com"
          git add secret-scan/
          git commit -m "secret-scan: report written by the runner [skip ci]"
          git push origin HEAD:titan/secret-scan-2026-10-24
